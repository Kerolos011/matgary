<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | متجري</title><link rel="stylesheet" href="css/main.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><div class="dash"><aside class="sidebar"><div class="side-logo">Admin</div><nav class="side-menu"><a class="active" href="admin.html">🏢 الإدارة</a><a href="#merchants">التجار</a><a href="#plans">الاشتراكات</a><a href="#templates">القوالب</a><a href="index.html">الموقع</a></nav></aside><main class="main"><div class="topbar"><div><h1>لوحة إدارة المنصة</h1><p>إدارة التجار والاشتراكات والقوالب</p></div></div><section class="kpi"><div class="card"><p>التجار</p><h2>342</h2></div><div class="card"><p>المتاجر النشطة</p><h2>291</h2></div><div class="card"><p>MRR</p><h2>185,000 ج.م</h2></div><div class="card"><p>تجارب مجانية</p><h2>74</h2></div></section><section class="grid grid-2"><div class="card"><h3>نمو الاشتراكات</h3><canvas id="growth"></canvas></div><div class="card"><h3>توزيع الباقات</h3><canvas id="plansChart"></canvas></div></section><br><section id="merchants" class="card table-wrap"><h3>إدارة التجار</h3><table><thead><tr><th>المتجر</th><th>الباقة</th><th>الحالة</th><th>المبيعات</th><th>إجراء</th></tr></thead><tbody id="merch"></tbody></table></section><br><section id="templates" class="card"><h3>إدارة القوالب</h3><div class="grid grid-4" id="tmpls"></div></section></main></div><script src="js/data.js"></script><script>merch.innerHTML=merchants.map(m=>`<tr><td>${m.name}</td><td>${m.plan}</td><td><span class='status ${m.status==='نشط'?'status-ok':'status-dark'}'>${m.status}</span></td><td>${money(m.sales)}</td><td><button class='btn btn-outline'>إيقاف/تفعيل</button></td></tr>`).join('');tmpls.innerHTML=Array.from({length:13},(_,i)=>`<div class='card center'><div class='template-preview'></div><strong>قالب ${i+1}</strong><br><span class='badge ${i<3?'badge-green':'badge-red'}'>${i<3?'مجاني':'Premium'}</span></div>`).join('');new Chart(growth,{type:'line',data:{labels:['يناير','فبراير','مارس','أبريل','مايو','يونيو'],datasets:[{label:'اشتراكات',data:[40,70,120,170,240,342],borderColor:'#DC2626'}]}});new Chart(plansChart,{type:'doughnut',data:{labels:['Starter','Business','Pro'],datasets:[{data:[65,25,10],backgroundColor:['#DC2626','#065F46','#1D4ED8']}]}});</script></body></html>
