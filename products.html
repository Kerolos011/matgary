<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات | متجري</title><link rel="stylesheet" href="css/main.css"></head><body><div class="dash"><aside class="sidebar"><div class="side-logo">متجري</div><nav class="side-menu"><a href="dashboard.html">📊 لوحة التحكم</a><a class="active" href="products.html">📦 المنتجات</a><a href="orders.html">🛒 الطلبات</a><a href="customers.html">👥 العملاء</a><a href="analytics.html">📈 التقارير</a><a href="settings.html">⚙️ الإعدادات</a></nav></aside><main class="main"><div class="topbar"><div><h1>إدارة المنتجات</h1><p>أضف وعدّل منتجات متجرك بسهولة</p></div><button id="add" class="btn btn-primary">+ إضافة منتج</button></div><div id="form" class="card hidden"><div class="form-row"><input id="n" class="input" placeholder="اسم المنتج"><input id="c" class="input" placeholder="الفئة"><input id="p" class="input" type="number" placeholder="السعر"><input id="st" class="input" type="number" placeholder="المخزون"></div><br><button id="save" class="btn btn-primary">حفظ</button></div><br><div class="card table-wrap"><table><thead><tr><th>#</th><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th></th></tr></thead><tbody id="body"></tbody></table></div></main></div><script src="js/data.js"></script><script>let ps=JSON.parse(localStorage.getItem('matgaryProducts')||JSON.stringify(products));function render(){body.innerHTML=ps.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.cat}</td><td>${money(x.price)}</td><td>${x.stock}</td><td><button class='btn btn-outline' onclick='del(${x.id})'>حذف</button></td></tr>`).join('')}function del(id){ps=ps.filter(x=>x.id!==id);localStorage.setItem('matgaryProducts',JSON.stringify(ps));render()}add.onclick=()=>form.classList.toggle('hidden');save.onclick=()=>{if(!n.value)return alert('اكتب اسم المنتج');ps.push({id:Date.now(),name:n.value,cat:c.value||'عام',price:p.value||0,stock:st.value||0});localStorage.setItem('matgaryProducts',JSON.stringify(ps));render();form.classList.add('hidden')};render();</script></body></html>
