<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | متجري</title><link rel="stylesheet" href="css/main.css"></head><body><header class="store-head"><div class="container store-nav"><a class="brand" href="store.html">Fashion Store</a></div></header><main class="container section"><h1>إتمام الطلب</h1><br><div class="grid grid-2"><div class="card"><h3>بيانات العميل</h3><br><input class="input" placeholder="الاسم"><br><br><input class="input" placeholder="الهاتف"><br><br><textarea class="input" placeholder="العنوان"></textarea><br><br><select><option>الدفع عند الاستلام</option><option>بطاقة بنكية</option><option>Apple Pay</option></select><br><br><button class="btn btn-primary" onclick="localStorage.removeItem('matgaryCart');alert('تم إنشاء الطلب بنجاح');location.href='store.html'">تأكيد الطلب</button></div><div class="card"><h3>ملخص الطلب</h3><p id="summary"></p></div></div></main><script src="js/data.js"></script><script>const c=cart();summary.innerHTML=c.map(i=>`${i.name} × ${i.qty}<br>`).join('')+'<br><strong>'+money(c.reduce((s,i)=>s+i.price*i.qty,0))+'</strong>';</script></body></html>
