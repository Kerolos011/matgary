<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات | متجري</title><link rel="stylesheet" href="main.css"></head><body><div class="dash"><aside class="sidebar"><div class="side-logo">متجري</div><nav class="side-menu"><a href="dashboard.html">📊 لوحة التحكم</a><a href="products.html">📦 المنتجات</a><a class="active" href="orders.html">🛒 الطلبات</a><a href="customers.html">👥 العملاء</a><a href="analytics.html">📈 التقارير</a><a href="settings.html">⚙️ الإعدادات</a></nav></aside><main class="main"><div class="topbar"><div><h1>إدارة الطلبات</h1><p>تابع الطلبات وحدّث حالتها</p></div></div><section class="kpi"><div class="card"><p>جديد</p><h2 id="newc">0</h2></div><div class="card"><p>جاري التجهيز</p><h2 id="proc">0</h2></div><div class="card"><p>مكتمل</p><h2 id="done">0</h2></div><div class="card"><p>المبيعات</p><h2 id="rev">0</h2></div></section><div class="card"><select id="filter"><option value="">كل الحالات</option><option>جديد</option><option>جاري التجهيز</option><option>تم الشحن</option><option>مكتمل</option><option>ملغي</option></select></div><br><div class="card table-wrap"><table><thead><tr><th>الطلب</th><th>العميل</th><th>القيمة</th><th>الدفع</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody id="body"></tbody></table></div></main></div><script src="js/data.js"></script><script>let os=JSON.parse(localStorage.getItem('matgaryOrders')||JSON.stringify(orders));function cls(s){return s==='جديد'?'status-new':s==='مكتمل'?'status-ok':s==='تم الشحن'?'status-blue':'status-dark'}function render(){let f=filter.value;let arr=f?os.filter(o=>o.status===f):os;body.innerHTML=arr.map(o=>`<tr><td>#${o.id}</td><td>${o.customer}</td><td>${money(o.amount)}</td><td>${o.payment}</td><td><span class='status ${cls(o.status)}'>${o.status}</span></td><td><select onchange='upd(${o.id},this.value)'><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='جاري التجهيز'?'selected':''}>جاري التجهيز</option><option ${o.status==='تم الشحن'?'selected':''}>تم الشحن</option><option ${o.status==='مكتمل'?'selected':''}>مكتمل</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select></td></tr>`).join('');newc.textContent=os.filter(x=>x.status==='جديد').length;proc.textContent=os.filter(x=>x.status==='جاري التجهيز').length;done.textContent=os.filter(x=>x.status==='مكتمل').length;rev.textContent=money(os.filter(x=>x.status!=='ملغي').reduce((s,x)=>s+x.amount,0));}function upd(id,s){os=os.map(o=>o.id===id?{...o,status:s}:o);localStorage.setItem('matgaryOrders',JSON.stringify(os));render()}filter.onchange=render;render();</script></body></html>
