<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | متجري</title><link rel="stylesheet" href="css/main.css"></head><body><header class="store-head"><div class="container store-nav"><a class="brand" href="store.html">Fashion Store</a><a class="btn btn-outline" href="store.html">استمرار التسوق</a></div></header><main class="container section"><h1>سلة المشتريات</h1><br><div class="card table-wrap"><table><thead><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>الإجمالي</th></tr></thead><tbody id="body"></tbody></table></div><br><div class="card" style="max-width:420px;margin-right:auto"><h3>الإجمالي: <span id="total">0</span></h3><br><a class="btn btn-primary" href="checkout.html">إتمام الطلب</a></div></main><script src="js/data.js"></script><script>const c=cart();body.innerHTML=c.map(i=>`<tr><td>${i.name}</td><td>${money(i.price)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join('')||'<tr><td colspan="4">السلة فارغة</td></tr>';total.textContent=money(c.reduce((s,i)=>s+i.price*i.qty,0));</script></body></html>
