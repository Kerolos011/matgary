<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Menu | متجري</title><link rel="stylesheet" href="main.css"></head><body><header class="store-head"><div class="container store-nav"><a class="brand" href="restaurant.html">مطعم البيت</a><span class="badge badge-red">QR Menu</span></div></header><main class="container section"><section class="store-hero"><h1>منيو مطعم البيت 🍔</h1><p>اطلب من الطاولة مباشرة بدون انتظار.</p></section><br><div class="card"><label>رقم الطاولة</label><select id="table"><option>اختر رقم الطاولة</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div><br><h2>المنيو</h2><div class="grid grid-3" id="menu"></div><br><div class="card"><h3>طلبك</h3><p id="order">لا توجد أصناف بعد</p><br><button class="btn btn-primary" onclick="alert('تم إرسال الطلب للمطبخ')">إرسال الطلب والدفع</button></div></main><script>const items=[['برجر دبل',150],['بيتزا مارجريتا',220],['بطاطس',60],['كولا',35],['باستا',180],['سلطة',75]];let order=[];menu.innerHTML=items.map((x,i)=>`<div class='card'><div class='fake-img'></div><h3>${x[0]}</h3><p>${x[1]} ج.م</p><button class='btn btn-primary' onclick='add(${i})'>أضف</button></div>`).join('');function add(i){order.push(items[i]);document.getElementById('order').innerHTML=order.map(x=>x[0]+' - '+x[1]+' ج.م').join('<br>')}</script></body></html>
