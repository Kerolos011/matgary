<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fashion Store | متجري</title><link rel="stylesheet" href="main.css"></head><body><header class="store-head"><div class="container store-nav"><a class="brand" href="store.html">Fashion Store</a><div><a href="cart.html" class="btn btn-outline">السلة <span data-cart-count class="cart-count">0</span></a></div></div></header><main class="container"><section class="store-hero"><h1>أحدث المنتجات وصلت!</h1><p>تسوق بسهولة من متجرنا التجريبي.</p></section><section class="section"><h2>الفئات</h2><div class="grid grid-4"><div class="card center">👕 ملابس</div><div class="card center">📱 إلكترونيات</div><div class="card center">💍 إكسسوارات</div><div class="card center">🏠 أدوات منزلية</div></div></section><section class="section"><div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap"><h2>المنتجات</h2><input id="search" class="input" style="max-width:320px" placeholder="ابحث عن منتج"></div><br><div id="list" class="grid grid-4"></div></section></main><script src="js/data.js"></script><script src="js/app.js"></script><script>function render(){let q=search.value||'';list.innerHTML=products.filter(p=>p.name.includes(q)||p.cat.includes(q)).map(p=>`<div class='card product-card'><div class='fake-img'></div><h3>${p.name}</h3><p>${p.cat}</p><strong>${money(p.price)}</strong><br><br><a class='btn btn-outline' href='product.html?id=${p.id}'>التفاصيل</a> <button class='btn btn-primary' onclick='addToCart(${p.id});location.reload()'>أضف للسلة</button></div>`).join('')}search.oninput=render;render();</script></body></html>
