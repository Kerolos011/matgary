<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منتج | متجري</title><link rel="stylesheet" href="css/main.css"></head><body><header class="store-head"><div class="container store-nav"><a class="brand" href="store.html">Fashion Store</a><a href="cart.html" class="btn btn-outline">السلة <span data-cart-count class="cart-count">0</span></a></div></header><main class="container section"><div id="product" class="grid grid-2"></div><br><h2>منتجات مشابهة</h2><div id="similar" class="grid grid-4"></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>const id=new URLSearchParams(location.search).get('id')||1;const p=products.find(x=>x.id==id)||products[0];product.innerHTML=`<div class='fake-img' style='height:420px'></div><div><span class='badge badge-green'>${p.cat}</span><h1>${p.name}</h1><p>وصف تجريبي لمنتج احترافي داخل المتجر، مناسب للعرض في نسخة البروتوتايب.</p><div class='price'>${money(p.price)}</div><button class='btn btn-primary' onclick='addToCart(${p.id});location.reload()'>إضافة للسلة</button></div>`;similar.innerHTML=products.filter(x=>x.id!==p.id).slice(0,4).map(x=>`<div class='card'><div class='fake-img'></div><h3>${x.name}</h3><strong>${money(x.price)}</strong></div>`).join('');</script></body></html>
